name: GitHub Pages deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund
      - name: Retrieve official Mightora brand assets
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/mightoraIoLogo4-200x900.png' -o assets/mightora-logo.png
          curl --fail --location --retry 3 'https://techtweedie.github.io/images/author/ian-tweedie-sq2_hu_a380911c6f4726de.png' -o assets/author-avatar.png
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/TechTweedie/techtweedie.github.io/v2/assets/images/site/main-logo.png' -o assets/author-blog-logo.png
      - run: npm test
      - run: REQUIRE_BRAND_ASSETS=1 npm run build
      - run: node scripts/verify.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4